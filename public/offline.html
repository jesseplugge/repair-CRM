<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Reparatie CRM</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #FAF7F1; color: #292420;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  .card { max-width: 26rem; padding: 2rem; text-align: center; }
  .icon {
    width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: 0.75rem;
    background: #0C7C82; color: white; display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { font-size: 0.9rem; color: #5C5346; margin: 0 0 1.25rem; line-height: 1.5; }
  button {
    border: none; border-radius: 0.5rem; padding: 0.6rem 1.25rem; font-size: 0.9rem; font-weight: 600;
    background: #0C7C82; color: white; cursor: pointer;
  }
  button:hover { background: #0A5F64; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">R</div>
    <h1>Geen verbinding</h1>
    <p>
      Deze pagina kon niet worden geladen omdat je offline bent. Reparatie CRM heeft een
      internetverbinding nodig om actuele gegevens te tonen — er wordt nooit verouderde
      informatie getoond.
    </p>
    <button onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
